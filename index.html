<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymark</title>
    <style>
      :root {
        --accent: #888;
      }
      body {
        margin: 0;
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        background: #ffffff;
        color: #222;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 48px 0;
      }
      .plate {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .plate canvas {
        display: block;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .caption {
        font-size: 13px;
        letter-spacing: 0.06em;
        color: #555;
      }
      .countdown {
        font-size: 12px;
        color: var(--accent);
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
