<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #888;
        --ink: #222;
        --muted: #767676;
      }
      body {
        margin: 0;
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        background: #ffffff;
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        position: fixed;
        top: 22px;
        left: 26px;
        right: 26px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        z-index: 10;
        pointer-events: none;
      }
      header a,
      header h1 {
        pointer-events: auto;
      }
      nav a {
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        letter-spacing: 0.08em;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 1px;
      }
      nav a:hover {
        color: var(--ink);
      }
      .brand {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 21px;
        margin: 0;
        letter-spacing: 0.01em;
        color: var(--ink);
      }
      .brand::after {
        content: '.';
        color: var(--accent);
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 84px 24px 48px;
        max-width: 1100px;
        margin: 0 auto;
      }
      body[data-route='today'] #app {
        min-height: calc(100vh - 132px);
        justify-content: center;
      }
      .plate {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .plate canvas {
        display: block;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .caption {
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .caption .seed {
        color: var(--accent);
        font-weight: 500;
      }
      .countdown {
        font-size: 12px;
        color: var(--accent);
        margin: 4px 0 0;
        font-variant-numeric: tabular-nums;
      }
      /* 아카이브 */
      .archive-title {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 17px;
        align-self: flex-start;
        margin: 0 0 6px;
        color: var(--muted);
      }
      .archive-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
        gap: 10px;
      }
      .archive-day {
        grid-column: 1 / -1;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--muted);
        border-bottom: 1px solid #eee;
        padding: 14px 0 4px;
      }
      .archive-tile {
        display: flex;
        flex-direction: column;
        gap: 3px;
        text-decoration: none;
      }
      .archive-tile canvas {
        width: 100%;
        aspect-ratio: 1;
        background: #f4f4f4;
        display: block;
      }
      .archive-tile:hover canvas {
        outline: 2px solid var(--accent);
      }
      .archive-time {
        font-size: 10px;
        color: var(--muted);
      }
      .archive-sentinel {
        height: 1px;
        width: 100%;
      }
      /* 판 상세 */
      .export-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
      }
      .export-label {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .export-btn {
        font-family: inherit;
        font-size: 12px;
        padding: 5px 12px;
        background: #fff;
        color: var(--ink);
        border: 1px solid #ddd;
        cursor: pointer;
      }
      .export-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .export-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .export-progress {
        font-size: 12px;
        color: var(--accent);
        min-width: 3.5em;
        font-variant-numeric: tabular-nums;
      }
      .plate-json {
        font-size: 11px;
        line-height: 1.7;
        color: var(--muted);
        background: #fafafa;
        border: 1px solid #eee;
        padding: 16px 20px;
        max-width: min(90vw, 720px);
        overflow-x: auto;
        margin-top: 24px;
      }
      .plate-error {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="brand"><a href="#/" style="color: inherit; text-decoration: none">daymark</a></h1>
      <nav><a href="#/archive">archive</a></nav>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
