<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #888;
        --ink: #222;
        --muted: #767676;
      }
      body {
        margin: 0;
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        background: #ffffff;
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      header {
        position: fixed;
        top: 22px;
        left: 26px;
      }
      .brand {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 21px;
        margin: 0;
        letter-spacing: 0.01em;
        color: var(--ink);
      }
      .brand::after {
        content: '.';
        color: var(--accent);
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 72px 0 48px;
      }
      .plate {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .plate canvas {
        display: block;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .caption {
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .caption .seed {
        color: var(--accent);
        font-weight: 500;
      }
      .countdown {
        font-size: 12px;
        color: var(--accent);
        margin: 4px 0 0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header><h1 class="brand">daymark</h1></header>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
