<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* SPEC §11.1 — 화면 전체가 흑백. 크롬에 색 0. 강조는 굵기와 여백으로만 */
      body {
        margin: 0;
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        background: #fff;
        color: #111;
        min-height: 100vh;
        transition:
          background 0.4s linear,
          color 0.4s linear;
      }
      header {
        position: fixed;
        top: 22px;
        left: 26px;
        z-index: 10;
      }
      .brand {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 21px;
        margin: 0;
        letter-spacing: 0.01em;
      }
      .brand a {
        color: inherit;
        text-decoration: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 72px 24px 48px;
        max-width: 900px;
        margin: 0 auto;
      }
      body[data-route='now'] #app {
        min-height: calc(100vh - 120px);
        justify-content: center;
      }
      .clock-wrap {
        position: relative;
        line-height: 0;
      }
      .clock-wrap canvas {
        display: block;
      }
      .clock-wrap canvas + canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .caption {
        font-size: 13px;
        letter-spacing: 0.06em;
        opacity: 0.75;
        margin: 10px 0 0;
        font-variant-numeric: tabular-nums;
      }
      .link-row {
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 12px;
        margin: 0;
      }
      .link-row a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        padding-bottom: 1px;
      }
      .low-power {
        font-family: inherit;
        font-size: 11px;
        background: none;
        color: inherit;
        border: 1px solid currentColor;
        opacity: 0.6;
        padding: 3px 10px;
        cursor: pointer;
        border-radius: 999px;
      }
      .low-power:hover {
        opacity: 1;
      }
      .export-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }
      .export-label {
        font-size: 11px;
        letter-spacing: 0.1em;
        opacity: 0.6;
        margin-left: 12px;
      }
      .export-btn {
        font-family: inherit;
        font-size: 12px;
        padding: 5px 12px;
        background: none;
        color: inherit;
        border: 1px solid currentColor;
        cursor: pointer;
      }
      .export-btn:hover:not(:disabled) {
        font-weight: 500;
      }
      .export-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .export-progress {
        font-size: 12px;
        opacity: 0.7;
        min-width: 4em;
        font-variant-numeric: tabular-nums;
      }
      .plate-json {
        font-size: 11px;
        line-height: 1.7;
        opacity: 0.75;
        border: 1px solid currentColor;
        padding: 16px 20px;
        max-width: min(90vw, 720px);
        overflow-x: auto;
        margin-top: 20px;
      }
      .plate-error {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="brand"><a href="#/">daymark.</a></h1>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
