<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymark — 판 미리보기 (개발용)</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: ui-monospace, monospace;
        background: #ffffff;
        color: #333;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tile canvas {
        width: 100%;
        border: 1px solid #eee;
      }
      .tile .label {
        font-size: 10px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>앞으로 24분의 판 — 시스템 5종 확인용</h1>
    <p>?start=YYYY-MM-DDTHH:mm 로 시작 시각 지정 가능</p>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/dev/plates.ts"></script>
  </body>
</html>
