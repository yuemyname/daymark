<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymark — 팔레트 100개 검수 (W0.2)</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: ui-monospace, monospace;
        background: #ffffff;
        color: #333;
      }
      .card {
        border: 1px solid #eee;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .card {
        border-radius: 6px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .swatches {
        display: flex;
        gap: 4px;
        height: 48px;
      }
      .swatches div {
        flex: 1;
        border-radius: 3px;
      }
      .meta {
        font-size: 10px;
        opacity: 0.8;
      }
      .fail {
        outline: 3px solid #ff3355;
      }
    </style>
  </head>
  <body>
    <h1>팔레트 100개 — ΔL &lt; 0.35 는 빨간 테두리</h1>
    <p id="summary"></p>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/dev/palettes.ts"></script>
  </body>
</html>
